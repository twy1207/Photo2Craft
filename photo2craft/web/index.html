<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Photo2Craft · 3D 비교</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
  <script type="importmap">{"imports":{"three":"/vendor/three/three.module.js","three/addons/":"/vendor/three/"}}</script>
</head>
<body>
  <header class="header">
    <a class="brand" href="/" aria-label="Photo2Craft 처음으로"><span class="brand-icon" aria-hidden="true">▧</span>Photo2Craft</a>
    <span class="badge">로컬 3D 미리보기</span>
  </header>
  <main>
    <div class="intro"><div><p class="eyebrow">PHOTO TO BLOCKS</p><h1>사진과 건축물 비교</h1></div><p>시점을 바꿔 형태와 비율을 살펴보세요.</p></div>
    <section class="toolbar" aria-label="예제 선택">
      <label for="building">건물 예제<select id="building" disabled><option>예제 불러오는 중</option></select></label>
      <div id="extent-control" hidden><label for="extent">최장변<select id="extent"></select></label></div>
      <div id="variants" class="segments" role="group" aria-label="생성 결과"></div>
      <p id="summary" class="summary" aria-live="polite"></p>
    </section>
    <div class="workspace">
      <section class="panel photo-panel" aria-labelledby="photo-title">
        <div class="panel-heading">
          <h2 id="photo-title">원본 사진</h2>
          <span id="photo-name"></span>
          <select id="reference" aria-label="원본 또는 Clay 시점" hidden></select>
        </div>
        <div class="photo-stage"><img id="photo" alt="" hidden><p id="reference-empty" hidden>함께 저장된 사진이 없습니다.</p></div>
        <p id="credit" class="credit"></p>
      </section>
      <section class="panel model-panel" aria-labelledby="model-title">
        <div class="panel-heading"><h2 id="model-title">3D 건축물</h2><span id="variant-label"></span></div>
        <div id="stage" class="model-stage" aria-busy="true">
          <canvas id="model" aria-label="마우스로 회전·확대하고 방향키로 이동할 수 있는 3D 건축물" tabindex="0"></canvas>
          <div id="status" class="status" role="status"><span>3D 화면 준비 중…</span></div>
          <span class="axis-label" aria-hidden="true">정면은 앞벽 기준</span>
        </div>
        <div class="view-controls" role="group" aria-label="시점 선택">
          <button type="button" data-view="front" disabled>정면</button>
          <button type="button" data-view="side" disabled>오른쪽</button>
          <button type="button" data-view="back" disabled>뒷면</button>
          <button type="button" data-view="reset" disabled>전체 보기</button>
        </div>
        <p class="gesture-help" id="gesture-help">드래그 회전 · 휠 확대 · 오른쪽 드래그·방향키 이동</p>
        <div class="block-editor" id="block-editor" hidden>
          <p id="edit-status" role="status"></p>
          <div class="edit-actions">
            <button type="button" id="edit-toggle" aria-pressed="false">블록 편집</button>
            <div id="edit-options" hidden>
              <select id="edit-mode" aria-label="선택 방식">
                <option value="area">영역 선택</option>
                <option value="single">블록 하나</option>
              </select>
              <button type="button" id="edit-apply">선택 제거</button>
            </div>
            <button type="button" id="edit-undo" hidden>되돌리기</button>
            <button type="button" id="edit-download" hidden>블록 JSON 저장</button>
          </div>
        </div>
      </section>
    </div>
    <section class="notes" aria-labelledby="notes-title"><h2 id="notes-title">결과 확인</h2><p>일부 특징이 생략되거나 단순화된 실험 결과입니다. 단색 블록이며 유리는 불투명하게 표시합니다.</p><ul id="notes"></ul></section>
    <noscript>3D 화면을 사용하려면 브라우저의 JavaScript를 켜 주세요.</noscript>
  </main>
  <script type="module">
    import('/app.js').catch(() => {
      const status = document.getElementById('status');
      status.className = 'status error';
      status.textContent = '3D 화면을 불러오지 못했습니다. 서버 실행 상태와 브라우저의 WebGL 지원을 확인해 주세요.';
    });
  </script>
</body>
</html>
